name: Binary Release

# Builds and publishes funnelbarn binaries on every push to main.
# Publishes to:
#   - APT repository:      https://webwiebe.nl/apt/ (via rapid-root centralized workflow)
#   - Homebrew tap (Cloudflare R2): https://webwiebe.nl/brew/funnelbarn-darwin-*.tar.gz
#   - GitHub Releases:     attached .deb and .tar.gz files
#
# Brew tarballs are uploaded directly to R2 (bucket:
# webwiebe-apt-repository-production, under the brew/ prefix). That prefix is
# SHARED with every other publisher (bugbarn, bb, spanbarn, dynamic-dns...), so
# uploads and prunes here are always scoped to funnelbarn's own name+arch
# prefixes — never a bucket-wide sync or LIST, and never `--delete`. After
# uploading, only the newest 2 versions of each tarball are kept, matching the
# bucket's 5GB retention policy (rapid-root's infra/docs/apt-repository.md,
# added in wiebe-xyz/rapid-root#2839).
#
# Required GitHub secrets for the brew publish:
#   R2_ACCESS_KEY  — Cloudflare R2 S3 access key
#   R2_SECRET_KEY  — Cloudflare R2 S3 secret key
#   R2_ENDPOINT    — R2 account S3 endpoint
#   R2_BUCKET      — webwiebe-apt-repository-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next_version.outputs.version }}
      version_num: ${{ steps.next_version.outputs.version_num }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest tag
        id: latest_tag
        run: |
          # fetch-tags: true above doesn't always pull every tag (depends on the
          # runner's local mirror state), so re-fetch explicitly to be safe.
          git fetch --tags --force origin
          # Only consider top-level vX.Y.Z tags. The Go module also pushes
          # sdks/go/vX.Y.Z tags, which would otherwise sort first.
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "${LATEST_TAG}" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: next_version
        run: |
          LATEST_TAG=${{ steps.latest_tag.outputs.tag }}
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "version_num=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          NEW_VERSION=${{ steps.next_version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_VERSION}" -m "Release ${NEW_VERSION}"
          # Go modules in a monorepo subdirectory need a path-prefixed tag so
          # `go get github.com/webwiebe/funnelbarn/sdks/go@vX.Y.Z` resolves.
          GO_TAG="sdks/go/${NEW_VERSION}"
          git tag -a "${GO_TAG}" -m "Go SDK ${NEW_VERSION}"
          git push origin "${NEW_VERSION}" "${GO_TAG}"

  publish-npm:
    needs: [tag]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Sync package version to release tag
        # Keeps package.json's version in sync with the git tag we just cut, so
        # `npm publish` doesn't 409 with "version already exists" on the second
        # run. --no-git-tag-version because the tag step already handles tagging.
        run: npm version "${{ needs.tag.outputs.version_num }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: [tag]
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Sync pyproject.toml version to release tag
        # Same reason as the npm job: PyPI rejects re-uploads of an existing
        # version, so we rewrite the version line before building.
        run: |
          python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          text = p.read_text()
          new = re.sub(r'^version\s*=\s*\".+\"', 'version = \"${{ needs.tag.outputs.version_num }}\"', text, count=1, flags=re.M)
          p.write_text(new)
          print(new[:200])
          "
      - run: pip install build twine
      - run: python -m build
      - name: Publish to PyPI
        if: env.PYPI_TOKEN != ''
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  upload-source-maps:
    name: Build Web UI and Upload Source Maps to BugBarn
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install SDK dependencies and build
        run: |
          npm ci --prefix sdks/js
          npm run build --prefix sdks/js
          mkdir -p web/public/sdk
          cp sdks/js/dist/iife/funnelbarn.js web/public/sdk/funnelbarn.js

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build web UI
        run: npm run build --prefix web

      - name: Upload source maps to BugBarn
        if: vars.BUGBARN_ENDPOINT != ''
        env:
          BUGBARN_ENDPOINT: ${{ vars.BUGBARN_ENDPOINT }}
          BUGBARN_API_KEY: ${{ secrets.FUNNELBARN_BUGBARN_API_KEY }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          for mapfile in web/dist/assets/*.map; do
            [ -f "$mapfile" ] || continue
            echo "Uploading ${mapfile}..."
            curl -sf -X POST "${BUGBARN_ENDPOINT}/api/v1/source-maps" \
              -H "X-BugBarn-Api-Key: ${BUGBARN_API_KEY}" \
              -F "project_slug=funnelbarn" \
              -F "version=${VERSION}" \
              -F "file=@${mapfile}" || echo "Source map upload skipped for ${mapfile}"
          done

  build-debs:
    name: Build .deb Packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: tag
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build binary
        env:
          GOOS: linux
          VERSION: ${{ needs.tag.outputs.version_num }}
        run: |
          GOARCH="${{ matrix.arch }}"
          export GOARCH
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X main.Version=v${VERSION} -X main.BuildTime=${BUILD_TIME}"
          mkdir -p dist
          go build -ldflags "${LDFLAGS}" -o dist/funnelbarn-linux-${GOARCH} ./cmd/funnelbarn

      - name: Build .deb package
        env:
          VERSION: ${{ needs.tag.outputs.version_num }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p debs
          envsubst < nfpm-funnelbarn.yaml > nfpm-funnelbarn-processed.yaml
          nfpm package \
            --config nfpm-funnelbarn-processed.yaml \
            --packager deb \
            --target debs/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.arch }}
          path: debs/*.deb
          retention-days: 30

  build-darwin-tarballs:
    name: Build macOS Tarballs (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: tag
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build macOS binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.tag.outputs.version_num }}
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X main.Version=v${VERSION} -X main.BuildTime=${BUILD_TIME}"
          mkdir -p dist
          go build -ldflags "${LDFLAGS}" -o dist/funnelbarn ./cmd/funnelbarn
          TARBALL="funnelbarn-darwin-${{ matrix.arch }}-${VERSION}.tar.gz"
          tar -czvf dist/${TARBALL} -C dist funnelbarn
          rm dist/funnelbarn

      - name: Generate checksums
        run: |
          cd dist
          for f in *.tar.gz; do sha256sum "$f" > "${f}.sha256"; done

      - name: Upload tarball artifacts
        uses: actions/upload-artifact@v7
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/*.tar.gz*
          retention-days: 30

  attach-debs-to-release:
    name: Attach .deb to Release
    runs-on: ubuntu-latest
    needs: [tag, build-debs]
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v8
        with:
          path: debs-download

      - name: Prepare release files
        run: |
          mkdir -p release
          find debs-download -name "*.deb" -exec cp {} release/ \;
          cd release && sha256sum *.deb > checksums-deb.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger rapid-root APT repository update
        env:
          GH_TOKEN: ${{ secrets.RAPID_ROOT_DISPATCH_TOKEN }}
        run: |
          gh api repos/wiebe-xyz/rapid-root/dispatches \
            --method POST \
            --field event_type=apt-package-update \
            --field 'client_payload[repo]=webwiebe/funnelbarn' \
            --field 'client_payload[tag]=${{ needs.tag.outputs.version }}' \
            --field 'client_payload[asset_pattern]=*.deb'

  attach-tarballs-to-release:
    name: Attach macOS Tarballs to Release
    runs-on: ubuntu-latest
    needs: [tag, build-darwin-tarballs]
    steps:
      - name: Download all darwin artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: darwin-*
          path: darwin-download

      - name: Prepare release files
        run: |
          mkdir -p release
          find darwin-download -name "*.tar.gz" -exec cp {} release/ \;
          find darwin-download -name "*.sha256" -exec cp {} release/ \;

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-brew-repo:
    name: Update Homebrew Tap (R2)
    runs-on: ubuntu-latest
    needs: [tag, build-darwin-tarballs]
    steps:
      - name: Download all darwin artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: darwin-*
          path: darwin-download

      - name: Prepare brew repository
        env:
          VERSION: ${{ needs.tag.outputs.version_num }}
        run: |
          mkdir -p brew-repo/Formula
          find darwin-download -name "*.tar.gz" -exec cp {} brew-repo/ \;
          find darwin-download -name "*.sha256" -exec cp {} brew-repo/ \;

          AMD64_SHA=$(cat brew-repo/funnelbarn-darwin-amd64-${VERSION}.tar.gz.sha256 | awk '{print $1}')
          ARM64_SHA=$(cat brew-repo/funnelbarn-darwin-arm64-${VERSION}.tar.gz.sha256 | awk '{print $1}')

          cat > brew-repo/Formula/funnelbarn.rb << EOF
          class Funnelbarn < Formula
            desc "Self-hosted web analytics server"
            homepage "https://github.com/wiebe-xyz/funnelbarn"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://webwiebe.nl/brew/funnelbarn-darwin-amd64-${VERSION}.tar.gz"
                sha256 "${AMD64_SHA}"
              elsif Hardware::CPU.arm?
                url "https://webwiebe.nl/brew/funnelbarn-darwin-arm64-${VERSION}.tar.gz"
                sha256 "${ARM64_SHA}"
              end
            end

            def install
              bin.install "funnelbarn"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/funnelbarn version")
            end
          end
          EOF

      - name: Deploy to R2 (brew/ prefix — only adds funnelbarn files)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Fail loudly rather than publishing nowhere. This job once uploaded
          # to storage the read path had already stopped serving, so the tap
          # advertised tarballs that 404'd and nobody noticed for four
          # releases. A missing secret must break the build, not go quiet.
          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL R2_BUCKET; do
            if [ -z "${!var}" ]; then
              echo "ERROR: ${var} is empty — the R2_* secrets must be configured on this repo."
              exit 1
            fi
          done

          pip install awscli

          # Upload per-file with `cp` rather than `s3 sync brew-repo/`: sync
          # LISTs the whole destination prefix to compute its delta, and brew/
          # holds every other publisher's tarballs too. `cp` touches only our
          # own keys.
          find brew-repo -type f | while read -r f; do
            key="${f#brew-repo/}"
            aws --endpoint-url "$AWS_ENDPOINT_URL" s3 cp \
              "$f" \
              "s3://${R2_BUCKET}/brew/${key}" \
              --cache-control "public, max-age=3600, must-revalidate"
          done

      - name: Prune old brew tarballs from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Keep only the newest KEEP versions of each tarball this job
          # publishes — the bucket's 5GB retention policy (rapid-root#2839 /
          # infra/docs/apt-repository.md). Scoped to funnelbarn's own name+arch
          # prefixes: a targeted list per prefix, never a bucket-wide LIST, so
          # other publishers' tarballs are never considered, let alone removed.
          KEEP=2
          for GROUP in funnelbarn-darwin-amd64 funnelbarn-darwin-arm64; do
            aws --endpoint-url "$AWS_ENDPOINT_URL" s3api list-objects-v2 \
              --bucket "$R2_BUCKET" --prefix "brew/${GROUP}-" \
              --query 'Contents[].Key' --output text 2>/dev/null \
              | tr '\t' '\n' | grep -E '\.tar\.gz$' | sort -V > /tmp/${GROUP}-versions.txt || true

            COUNT=$(wc -l < /tmp/${GROUP}-versions.txt)
            DROP=$((COUNT - KEEP))
            if [ "$DROP" -gt 0 ]; then
              head -n "$DROP" /tmp/${GROUP}-versions.txt | while read -r key; do
                echo "Pruning old brew tarball: $key"
                aws --endpoint-url "$AWS_ENDPOINT_URL" s3 rm "s3://${R2_BUCKET}/${key}"
                aws --endpoint-url "$AWS_ENDPOINT_URL" s3 rm "s3://${R2_BUCKET}/${key}.sha256" || true
              done
            else
              echo "${GROUP}: ${COUNT} tarball(s) in R2, nothing to prune."
            fi
          done

  update-homebrew-tap:
    name: Update GitHub Tap Repository
    runs-on: ubuntu-latest
    needs: [tag, update-brew-repo]
    steps:
      - name: Download darwin artifacts for checksums
        uses: actions/download-artifact@v8
        with:
          pattern: darwin-*
          path: darwin-download

      - name: Generate formula and push to tap
        env:
          VERSION: ${{ needs.tag.outputs.version_num }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "ERROR: TAP_GITHUB_TOKEN secret is required"
            exit 1
          fi

          AMD64_SHA=$(cat darwin-download/darwin-amd64/funnelbarn-darwin-amd64-${VERSION}.tar.gz.sha256 | awk '{print $1}')
          ARM64_SHA=$(cat darwin-download/darwin-arm64/funnelbarn-darwin-arm64-${VERSION}.tar.gz.sha256 | awk '{print $1}')

          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/webwiebe/homebrew-funnelbarn.git tap-repo
          cd tap-repo
          mkdir -p Formula

          cat > Formula/funnelbarn.rb << EOF
          class Funnelbarn < Formula
            desc "Self-hosted web analytics server"
            homepage "https://github.com/wiebe-xyz/funnelbarn"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://webwiebe.nl/brew/funnelbarn-darwin-amd64-${VERSION}.tar.gz"
                sha256 "${AMD64_SHA}"
              elsif Hardware::CPU.arm?
                url "https://webwiebe.nl/brew/funnelbarn-darwin-arm64-${VERSION}.tar.gz"
                sha256 "${ARM64_SHA}"
              end
            end

            def install
              bin.install "funnelbarn"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/funnelbarn version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/funnelbarn.rb
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update formula to ${VERSION}"
            git push
          fi
