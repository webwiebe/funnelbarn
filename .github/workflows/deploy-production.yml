name: Deploy Production

# Two entry points:
#   - workflow_call from the promote job in build-and-test.yml, after the commit passed testing,
#     E2E, the staging rollout and the staging smoke check. This is the normal path.
#   - workflow_dispatch, kept for a manual rollback or redeploy of a known version.
# `production_version` is a version tag or a commit SHA; both resolve to the SHA
# the images are tagged with. Preflight also resolves it to the release tag
# (deploy/release-tag.sh), which the pods, the smoke checks and the BugBarn
# marker report as the version, so a promote that passes the SHA still reports
# vX.Y.Z (#489).
on:
  workflow_call:
    inputs:
      production_version:
        description: 'Version tag or commit SHA to deploy'
        required: true
        type: string
      confirmed:
        description: 'The caller has verified the version on staging'
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      production_version:
        description: 'Version to deploy (e.g. v0.1.0) — must already be on staging'
        required: true
        type: string
      confirmed:
        description: 'I confirm this version is validated on staging'
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  SERVICE_IMAGE: ghcr.io/webwiebe/funnelbarn/service
  WEB_IMAGE: ghcr.io/webwiebe/funnelbarn/web
  K3S_HOST: layer7.wiebe.xyz
  K3S_USER: deployer
  NAMESPACE: funnelbarn-production

jobs:
  preflight:
    runs-on: [self-hosted, build]
    # Ten minutes: the release tag lookup may wait up to five for binary-release.
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      service_digest: ${{ steps.resolve.outputs.service_digest }}
      web_digest: ${{ steps.resolve.outputs.web_digest }}
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Require confirmation
        run: |
          if [ "${{ inputs.confirmed }}" != "true" ]; then
            echo "ERROR: Set 'confirmed' to true to proceed with production deploy"
            exit 1
          fi

      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        # No `|| true`: if the cache cannot be cleared, checkout fails next anyway, so fail here with the cause.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c"
            rm -rf "$c"
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The version the deploy reports. promote passes the commit SHA, and
      # binary-release tags that commit on the same push, so this waits for the
      # tag and fails without one: production never reports a bare SHA.
      - name: Resolve the release tag
        id: release
        env:
          PRODUCTION_VERSION: ${{ inputs.production_version }}
        run: |
          set -euo pipefail
          RELEASE=$(deploy/release-tag.sh "${PRODUCTION_VERSION}")
          echo "Release tag for ${PRODUCTION_VERSION}: ${RELEASE}"
          echo "version=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Resolve version tag to SHA and verify images in GHCR
        id: resolve
        run: |
          set -euo pipefail
          VERSION="${{ inputs.production_version }}"
          # Resolve version tag to the commit SHA (images are tagged by SHA in testing CI)
          SHA=$(git rev-list -n1 "${VERSION}" 2>/dev/null) || \
            { echo "ERROR: Tag ${VERSION} not found in repo"; exit 1; }
          echo "Resolved ${VERSION} -> ${SHA}"
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}"
          mkdir -p "$DOCKER_CONFIG_DIR"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$DOCKER_CONFIG_DIR/config.json"
          export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"
          docker manifest inspect "${SERVICE_IMAGE}:${SHA}" > /dev/null || \
            { echo "ERROR: ${SERVICE_IMAGE}:${SHA} not found in GHCR (for ${VERSION})"; exit 1; }
          docker manifest inspect "${WEB_IMAGE}:${SHA}" > /dev/null || \
            { echo "ERROR: ${WEB_IMAGE}:${SHA} not found in GHCR (for ${VERSION})"; exit 1; }
          echo "Images verified for ${VERSION} (${SHA})"
          # Resolve each tag to its digest now; the deploy uses image@digest, so a
          # tag that is moved after this point cannot change what ships.
          SERVICE_DIGEST=$(docker buildx imagetools inspect "${SERVICE_IMAGE}:${SHA}" --format '{{.Manifest.Digest}}')
          WEB_DIGEST=$(docker buildx imagetools inspect "${WEB_IMAGE}:${SHA}" --format '{{.Manifest.Digest}}')
          case "${SERVICE_DIGEST}${WEB_DIGEST}" in
            sha256:*sha256:*) ;;
            *) echo "ERROR: could not resolve image digests (service='${SERVICE_DIGEST}' web='${WEB_DIGEST}')"; exit 1 ;;
          esac
          echo "service ${SERVICE_DIGEST}"
          echo "web     ${WEB_DIGEST}"
          {
            echo "sha=${SHA}"
            echo "service_digest=${SERVICE_DIGEST}"
            echo "web_digest=${WEB_DIGEST}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    runs-on: [self-hosted, build]
    timeout-minutes: 20
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        # No `|| true`: if the cache cannot be cleared, checkout fails next anyway, so fail here with the cause.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c"
            rm -rf "$c"
          fi
      - uses: actions/checkout@v6

      - name: Pin manifests to this release
        run: |
          deploy/pin-release.sh production "${{ needs.preflight.outputs.sha }}" "${{ needs.preflight.outputs.version }}" \
            "${{ needs.preflight.outputs.service_digest }}" "${{ needs.preflight.outputs.web_digest }}"

      - name: Transfer manifests
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "rm -rf /tmp/funnelbarn-deploy && mkdir -p /tmp/funnelbarn-deploy"
          scp -o StrictHostKeyChecking=no -r deploy \
            "${K3S_USER}@${K3S_HOST}:/tmp/funnelbarn-deploy/deploy"

      - name: Ensure namespace exists
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f /tmp/funnelbarn-deploy/deploy/k8s/production/namespace.yaml"

      - name: Decrypt and apply secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          sops -d deploy/k8s/production/secret.yaml | \
            ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f -"

      - name: Create GHCR pull secret
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" "
            kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username='webwiebe' \
              --docker-password='${{ secrets.GHCR_PULL_PAT }}' \
              --namespace=${NAMESPACE} \
              --dry-run=client -o yaml | kubectl apply -f -
          "

      # A rollback can only put the previous IMAGE back; it cannot undo a
      # migration, because goose.Up runs inside repository.Open before the
      # server listens. Work out up front whether this release carries one, so
      # the failure path knows whether rolling back is safe or actively
      # harmful — and record the litestream restore point while the old
      # database is still the live one.
      - name: Record restore point and detect migrations
        id: pre
        run: |
          set -uo pipefail
          SHA="${{ needs.preflight.outputs.sha }}"
          # The SHA comes from the release annotation written after the last
          # good deploy; the image string is only a fallback for a deployment
          # that predates it (a digest-form image carries no SHA).
          ANNOTATION=$(ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl -n ${NAMESPACE} get deployment funnelbarn -o jsonpath='{.metadata.annotations.funnelbarn\.wiebe\.xyz/release-sha}'" || true)
          IMAGE=$(ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl -n ${NAMESPACE} get deployment funnelbarn -o jsonpath='{.spec.template.spec.containers[0].image}'" || true)
          CURRENT=$(deploy/deployed-sha.sh "${ANNOTATION}" "${IMAGE}")
          echo "currently deployed: ${CURRENT:-<none>}"

          # Default to "assume migrations" — refusing a safe rollback costs a
          # manual command, allowing an unsafe one costs an outage.
          CARRIES=true
          if [ -z "${CURRENT}" ]; then
            echo "WARNING: could not read the deployed image; assuming this release carries migrations"
          elif ! git cat-file -e "${CURRENT}^{commit}" 2>/dev/null; then
            echo "WARNING: deployed SHA ${CURRENT} is not in this checkout; assuming this release carries migrations"
          else
            CHANGED=$(git diff --name-only "${CURRENT}" "${SHA}" -- internal/repository/migrations/)
            if [ -z "${CHANGED}" ]; then
              CARRIES=false
              echo "No migration changes between ${CURRENT} and ${SHA} — rollback is safe."
            else
              echo "This release changes migrations:"
              echo "${CHANGED}"
            fi
          fi
          echo "carries_migrations=${CARRIES}" >> "$GITHUB_OUTPUT"

          # The revision each workload runs now. The rollback puts exactly these
          # back; a plain undo steps past them when the apply never landed.
          for w in writer:deployment/funnelbarn web:deployment/funnelbarn-web reader:statefulset/funnelbarn-reader; do
            REV=$(ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
              "sh /tmp/funnelbarn-deploy/deploy/restore-revision.sh record ${NAMESPACE} ${w#*:}" || true)
            echo "${w%%:*}: ${w#*:} at revision ${REV:-<none>}"
            echo "${w%%:*}_revision=${REV}" >> "$GITHUB_OUTPUT"
          done

          RESTORE=$(ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl -n ${NAMESPACE} exec deploy/funnelbarn -c funnelbarn -- \
             litestream generations -config /etc/litestream.yml /var/lib/funnelbarn/funnelbarn.db" 2>/dev/null | tail -2)
          {
            echo "### Pre-deploy state"
            echo ""
            echo "- Deployed image: \`${CURRENT:-unknown}\`"
            echo "- Carries migrations: \`${CARRIES}\`"
            echo ""
            echo "Litestream restore point (the replica keeps 6 to 7 days):"
            echo ""
            echo '```'
            echo "${RESTORE:-unavailable}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Register MCP resource and check sign-in scopes with IAMBarn
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          IAMBARN_URL="$(sops -d --extract '["stringData"]["FUNNELBARN_OIDC_ISSUER"]' deploy/k8s/production/secret.yaml)"
          CLIENT_ID="$(sops -d --extract '["stringData"]["FUNNELBARN_OIDC_CLIENT_ID"]' deploy/k8s/production/secret.yaml)"
          echo "::add-mask::${IAMBARN_URL}"
          IAMBARN_ADMIN_TOKEN="$(sops -d --extract '["stringData"]["IAMBARN_ADMIN_TOKEN"]' deploy/k8s/production/secret.yaml)"
          echo "::add-mask::${CLIENT_ID}"
          echo "::add-mask::${IAMBARN_ADMIN_TOKEN}"
          export IAMBARN_URL CLIENT_ID IAMBARN_ADMIN_TOKEN
          export RESOURCE_URL="https://funnelbarn.wiebe.xyz/api/v1/mcp"
          deploy/iambarn/register-mcp-resource.sh production

      - name: Apply manifests and roll out
        id: apply
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" "
            set -euo pipefail
            kubectl apply -k /tmp/funnelbarn-deploy/deploy/k8s/production
            kubectl -n ${NAMESPACE} rollout status deployment/funnelbarn --timeout=180s
            kubectl -n ${NAMESPACE} rollout status statefulset/funnelbarn-reader --timeout=180s
            kubectl -n ${NAMESPACE} rollout status deployment/funnelbarn-web --timeout=180s
            # Smoke: the stated version at the preflight commit. A failure runs the rollback step.
            sh /tmp/funnelbarn-deploy/deploy/assert-version.sh ${NAMESPACE} deploy/funnelbarn funnelbarn ${{ needs.preflight.outputs.version }} ${{ needs.preflight.outputs.sha }}
            sh /tmp/funnelbarn-deploy/deploy/assert-version.sh ${NAMESPACE} pod/funnelbarn-reader-0 funnelbarn ${{ needs.preflight.outputs.version }} ${{ needs.preflight.outputs.sha }}
          "

      # Must stay above the rollback step: a failed smoke check fails the job and
      # so triggers the rollback below.
      - name: Smoke check production
        run: scripts/smoke.sh https://funnelbarn.wiebe.xyz "${{ needs.preflight.outputs.version }}"

      # One-shot read-only scan of the stored replay chunks (#462): counts per
      # project in the step summary, nothing deleted. It runs in its own pod,
      # never in the writer, and is skipped while its Job still exists (the Job
      # is kept for seven days). The step always ends 0, so a failed scan never
      # rolls back a good release; a failure or timeout shows as a warning on
      # the run.
      - name: Scan stored replay chunks
        run: |
          # The runner starts steps with bash -e, and -o pipefail leaves -e on.
          # This step reports and never fails the deploy, so turn -e off.
          set +e
          set -uo pipefail
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" "
            set -u
            NS=${NAMESPACE}
            if kubectl -n \$NS get job recordings-url-scan >/dev/null 2>&1; then
              DONE=\$(kubectl -n \$NS get job recordings-url-scan -o jsonpath='{range .status.conditions[?(@.status==\"True\")]}{.type} {end}')
              case \" \$DONE\" in
                *' Complete '*|*' Failed '*)
                  echo \"deleting the finished Job (\$DONE) before running it again\"
                  kubectl -n \$NS delete job recordings-url-scan --wait=true --timeout=120s || exit 6
                  ;;
                *)
                  echo 'recordings-url-scan is still running, skipping'
                  kubectl -n \$NS logs job/recordings-url-scan --tail=20 || true
                  exit 0
                  ;;
              esac
            fi
            IMAGE=\$(kubectl -n \$NS get deployment funnelbarn -o jsonpath='{.spec.template.spec.containers[0].image}') || exit 3
            sed \"s#image: funnelbarn/service.*#image: \$IMAGE#\" /tmp/funnelbarn-deploy/deploy/k8s/production/jobs/recordings-url-scan.yaml | kubectl apply -f - || exit 4
            kubectl -n \$NS wait --for=condition=complete job/recordings-url-scan --timeout=120s || RC=5
            echo '--- scan output'
            kubectl -n \$NS logs job/recordings-url-scan --tail=200 || true
            exit \${RC:-0}
          " > /tmp/recordings-url-scan.out 2>&1
          rc=$?
          cat /tmp/recordings-url-scan.out || true
          if [ "$rc" -ne 0 ]; then
            case "$rc" in
              3) why="could not read the running image" ;;
              4) why="could not apply the Job" ;;
              6) why="could not delete the finished Job" ;;
              5) why="the scan did not finish within 120 s or failed; the Job keeps running (deadline 3600 s) and its logs stay for seven days: kubectl -n funnelbarn-production logs job/recordings-url-scan" ;;
              *) why="ssh or kubectl failed (exit $rc)" ;;
            esac
            echo "::warning title=Replay chunk scan::${why}"
          fi
          {
            echo "### Replay chunk URL scan (counts only)"
            echo ""
            echo '```'
            cat /tmp/recordings-url-scan.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Written only after the smoke check passed, so a release that was rolled
      # back never leaves its SHA behind. The next deploy reads it to decide
      # whether its rollback is safe. Annotating the Deployment metadata does not
      # touch the pod template, so no rollout follows.
      - name: Record released SHA
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl -n ${NAMESPACE} annotate deployment/funnelbarn funnelbarn.wiebe.xyz/release-sha=${{ needs.preflight.outputs.sha }} --overwrite"

      # NOTE: no blanket `|| true`. A rollback that silently fails is worse
      # than one that reports, because it leaves the impression the deploy was
      # recovered when it was not.
      - name: Rollback on failure
        if: failure()
        run: |
          set -uo pipefail
          if [ "${{ steps.pre.outputs.carries_migrations }}" != "false" ]; then
            echo "::error::NOT rolling back: this release carried a schema migration."
            echo "Migrations run at process start, so the schema has already moved forward."
            echo "Putting the previous image back would run OLD code against the NEW schema —"
            echo "e.g. after 00034 the previous UpsertSession's ON CONFLICT(id) matches no"
            echo "unique index and every event insert fails. That is an outage, not a recovery."
            echo ""
            echo "The new image is left running. To recover the DATA, restore from litestream"
            echo "(restore point is in this run's summary; the replica keeps 6 to 7 days):"
            echo ""
            echo "  POD=\$(kubectl -n ${NAMESPACE} get pods -l app.kubernetes.io/name=funnelbarn -o jsonpath='{.items[0].metadata.name}')"
            echo "  kubectl -n ${NAMESPACE} exec \$POD -c funnelbarn -- \\"
            echo "    litestream restore -config /etc/litestream.yml -timestamp <RFC3339> \\"
            echo "      -o /tmp/pre.db /var/lib/funnelbarn/funnelbarn.db"
            echo ""
            echo "Then repair from /tmp/pre.db, or roll forward with a corrective migration."
            exit 1
          fi
          echo "Release carries no migrations; putting back the revisions recorded before the deploy."
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" "
            set -eu
            R=/tmp/funnelbarn-deploy/deploy/restore-revision.sh
            sh \$R restore ${NAMESPACE} deployment/funnelbarn '${{ steps.pre.outputs.writer_revision }}'
            sh \$R restore ${NAMESPACE} deployment/funnelbarn-web '${{ steps.pre.outputs.web_revision }}'
            # Last: on the release that introduces the readers the StatefulSet
            # had no revision to record and this fails. deploy/RUNBOOK.md has
            # the steps to send traffic back to the writer in that case.
            sh \$R restore ${NAMESPACE} statefulset/funnelbarn-reader '${{ steps.pre.outputs.reader_revision }}'
          "

      # The refusal above leaves production on the new image, with 24h of restore
      # point. barn-watch lists a single red run only once it is 24h old, and a
      # later green run clears it, so the red run alone can miss that window. This
      # event opens a BugBarn issue at once, and barn-watch files it on its next
      # daily run. An apply that never ran left production as it was: nothing to
      # report. No `|| echo`: a report that did not land has to show in the log.
      - name: Report refused rollback to BugBarn
        if: failure() && vars.BUGBARN_ENDPOINT != '' && steps.pre.outputs.carries_migrations == 'true' && steps.apply.outcome != 'skipped'
        env:
          BUGBARN_ENDPOINT: ${{ vars.BUGBARN_ENDPOINT }}
          BUGBARN_API_KEY: ${{ secrets.FUNNELBARN_BUGBARN_API_KEY }}
        run: |
          set -euo pipefail
          curl -sf --retry 3 --max-time 20 -X POST "${BUGBARN_ENDPOINT}/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "X-BugBarn-Api-Key: ${BUGBARN_API_KEY}" \
            -H "X-BugBarn-Project: funnelbarn" \
            -d "{
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"severityText\": \"error\",
              \"exception\": {
                \"type\": \"RollbackRefused\",
                \"message\": \"Production deploy failed and rollback was refused: the release carried a schema migration\"
              },
              \"attributes\": {
                \"environment\": \"production\",
                \"release\": \"${{ needs.preflight.outputs.version }}\",
                \"run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"
              }
            }" || { echo "::error::Could not report the refused rollback to BugBarn."; exit 1; }

      - name: Post release marker to BugBarn
        if: vars.BUGBARN_ENDPOINT != ''
        env:
          BUGBARN_ENDPOINT: ${{ vars.BUGBARN_ENDPOINT }}
          BUGBARN_API_KEY: ${{ secrets.FUNNELBARN_BUGBARN_API_KEY }}
        run: |
          curl -sf -X POST "${BUGBARN_ENDPOINT}/api/v1/releases" \
            -H "Content-Type: application/json" \
            -H "X-BugBarn-Api-Key: ${BUGBARN_API_KEY}" \
            -H "X-BugBarn-Project: funnelbarn" \
            -d "{
              \"name\": \"${{ needs.preflight.outputs.version }}\",
              \"environment\": \"production\",
              \"version\": \"${{ needs.preflight.outputs.version }}\",
              \"url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${{ needs.preflight.outputs.version }}\",
              \"notes\": \"Deployed by GitHub Actions run #${GITHUB_RUN_NUMBER}\"
            }" || echo "BugBarn release marker skipped"

      - name: Summary
        run: |
          echo "## Production Deploy Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.preflight.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://funnelbarn.wiebe.xyz |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Namespace | \`${NAMESPACE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | \`${K3S_HOST}\` |" >> "$GITHUB_STEP_SUMMARY"
