name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      production_version:
        description: 'Version to deploy (e.g. v0.1.0) — must already be on staging'
        required: true
        type: string
      confirmed:
        description: 'I confirm this version is validated on staging'
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  SERVICE_IMAGE: ghcr.io/webwiebe/funnelbarn/service
  WEB_IMAGE: ghcr.io/webwiebe/funnelbarn/web
  K3S_HOST: layer7.wiebe.xyz
  K3S_USER: deployer
  NAMESPACE: funnelbarn-production

jobs:
  preflight:
    runs-on: [self-hosted, build]
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Require confirmation
        run: |
          if [ "${{ github.event.inputs.confirmed }}" != "true" ]; then
            echo "ERROR: Set 'confirmed' to true to proceed with production deploy"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version tag to SHA and verify images in GHCR
        id: resolve
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.production_version }}"
          # Resolve version tag to the commit SHA (images are tagged by SHA in testing CI)
          SHA=$(git rev-list -n1 "${VERSION}" 2>/dev/null) || \
            { echo "ERROR: Tag ${VERSION} not found in repo"; exit 1; }
          echo "Resolved ${VERSION} -> ${SHA}"
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}"
          mkdir -p "$DOCKER_CONFIG_DIR"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$DOCKER_CONFIG_DIR/config.json"
          export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"
          docker manifest inspect "${SERVICE_IMAGE}:${SHA}" > /dev/null || \
            { echo "ERROR: ${SERVICE_IMAGE}:${SHA} not found in GHCR (for ${VERSION})"; exit 1; }
          docker manifest inspect "${WEB_IMAGE}:${SHA}" > /dev/null || \
            { echo "ERROR: ${WEB_IMAGE}:${SHA} not found in GHCR (for ${VERSION})"; exit 1; }
          echo "Images verified for ${VERSION} (${SHA})"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    runs-on: [self-hosted, build]
    timeout-minutes: 20
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v6

      - name: Transfer manifests
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "rm -rf /tmp/funnelbarn-deploy && mkdir -p /tmp/funnelbarn-deploy"
          scp -o StrictHostKeyChecking=no -r deploy \
            "${K3S_USER}@${K3S_HOST}:/tmp/funnelbarn-deploy/deploy"

      - name: Ensure namespace exists
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f /tmp/funnelbarn-deploy/deploy/k8s/production/namespace.yaml"

      - name: Decrypt and apply secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          sops -d deploy/k8s/production/secret.yaml | \
            ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f -"

      - name: Create GHCR pull secret
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" "
            kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username='webwiebe' \
              --docker-password='${{ secrets.GHCR_PULL_PAT }}' \
              --namespace=${NAMESPACE} \
              --dry-run=client -o yaml | kubectl apply -f -
          "

      # A rollback can only put the previous IMAGE back; it cannot undo a
      # migration, because goose.Up runs inside repository.Open before the
      # server listens. Work out up front whether this release carries one, so
      # the failure path knows whether rolling back is safe or actively
      # harmful — and record the litestream restore point while the old
      # database is still the live one.
      - name: Record restore point and detect migrations
        id: pre
        run: |
          set -uo pipefail
          SHA="${{ needs.preflight.outputs.sha }}"
          CURRENT=$(ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl -n ${NAMESPACE} get deployment funnelbarn -o jsonpath='{.spec.template.spec.containers[0].image}'" \
            | sed 's/.*://')
          echo "currently deployed: ${CURRENT:-<none>}"

          # Default to "assume migrations" — refusing a safe rollback costs a
          # manual command, allowing an unsafe one costs an outage.
          CARRIES=true
          if [ -z "${CURRENT}" ]; then
            echo "WARNING: could not read the deployed image; assuming this release carries migrations"
          elif ! git cat-file -e "${CURRENT}^{commit}" 2>/dev/null; then
            echo "WARNING: deployed SHA ${CURRENT} is not in this checkout; assuming this release carries migrations"
          else
            CHANGED=$(git diff --name-only "${CURRENT}" "${SHA}" -- internal/repository/migrations/)
            if [ -z "${CHANGED}" ]; then
              CARRIES=false
              echo "No migration changes between ${CURRENT} and ${SHA} — rollback is safe."
            else
              echo "This release changes migrations:"
              echo "${CHANGED}"
            fi
          fi
          echo "carries_migrations=${CARRIES}" >> "$GITHUB_OUTPUT"

          RESTORE=$(ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" \
            "kubectl -n ${NAMESPACE} exec deploy/funnelbarn -c funnelbarn -- \
             litestream generations -config /etc/litestream.yml /var/lib/funnelbarn/funnelbarn.db" 2>/dev/null | tail -2)
          {
            echo "### Pre-deploy state"
            echo ""
            echo "- Deployed image: \`${CURRENT:-unknown}\`"
            echo "- Carries migrations: \`${CARRIES}\`"
            echo ""
            echo "Litestream restore point (retention is 24h):"
            echo ""
            echo '```'
            echo "${RESTORE:-unavailable}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply manifests and roll out
        run: |
          set -euo pipefail
          SHA="${{ needs.preflight.outputs.sha }}"
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" "
            set -euo pipefail
            kubectl apply -k /tmp/funnelbarn-deploy/deploy/k8s/production
            kubectl -n ${NAMESPACE} set image deployment/funnelbarn \
              funnelbarn=${SERVICE_IMAGE}:${SHA}
            kubectl -n ${NAMESPACE} set env deployment/funnelbarn \
              FUNNELBARN_VERSION=${{ github.event.inputs.production_version }}
            kubectl -n ${NAMESPACE} set image deployment/funnelbarn-web \
              funnelbarn-web=${WEB_IMAGE}:${SHA}
            kubectl -n ${NAMESPACE} rollout status deployment/funnelbarn --timeout=180s
            kubectl -n ${NAMESPACE} rollout status deployment/funnelbarn-web --timeout=180s
          "

      # NOTE: no blanket `|| true`. A rollback that silently fails is worse
      # than one that reports, because it leaves the impression the deploy was
      # recovered when it was not.
      - name: Rollback on failure
        if: failure()
        run: |
          set -uo pipefail
          if [ "${{ steps.pre.outputs.carries_migrations }}" != "false" ]; then
            echo "::error::NOT rolling back: this release carried a schema migration."
            echo "Migrations run at process start, so the schema has already moved forward."
            echo "Putting the previous image back would run OLD code against the NEW schema —"
            echo "e.g. after 00034 the previous UpsertSession's ON CONFLICT(id) matches no"
            echo "unique index and every event insert fails. That is an outage, not a recovery."
            echo ""
            echo "The new image is left running. To recover the DATA, restore from litestream"
            echo "(restore point is in this run's summary; retention is 24h):"
            echo ""
            echo "  POD=\$(kubectl -n ${NAMESPACE} get pods -l app.kubernetes.io/name=funnelbarn -o jsonpath='{.items[0].metadata.name}')"
            echo "  kubectl -n ${NAMESPACE} exec \$POD -c funnelbarn -- \\"
            echo "    litestream restore -config /etc/litestream.yml -timestamp <RFC3339> \\"
            echo "      -o /tmp/pre.db /var/lib/funnelbarn/funnelbarn.db"
            echo ""
            echo "Then repair from /tmp/pre.db, or roll forward with a corrective migration."
            exit 1
          fi
          echo "Release carries no migrations; rolling the image back."
          ssh -o StrictHostKeyChecking=no "${K3S_USER}@${K3S_HOST}" "
            set -eu
            kubectl -n ${NAMESPACE} rollout undo deployment/funnelbarn
            kubectl -n ${NAMESPACE} rollout undo deployment/funnelbarn-web
          "

      - name: Post release marker to BugBarn
        if: vars.BUGBARN_ENDPOINT != ''
        env:
          BUGBARN_ENDPOINT: ${{ vars.BUGBARN_ENDPOINT }}
          BUGBARN_API_KEY: ${{ secrets.FUNNELBARN_BUGBARN_API_KEY }}
        run: |
          curl -sf -X POST "${BUGBARN_ENDPOINT}/api/v1/releases" \
            -H "Content-Type: application/json" \
            -H "X-BugBarn-Api-Key: ${BUGBARN_API_KEY}" \
            -H "X-BugBarn-Project: funnelbarn" \
            -d "{
              \"name\": \"${{ github.event.inputs.production_version }}\",
              \"environment\": \"production\",
              \"version\": \"${{ github.event.inputs.production_version }}\",
              \"url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${{ github.event.inputs.production_version }}\",
              \"notes\": \"Deployed by GitHub Actions run #${GITHUB_RUN_NUMBER}\"
            }" || echo "BugBarn release marker skipped"

      - name: Summary
        run: |
          echo "## Production Deploy Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ github.event.inputs.production_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://funnelbarn.wiebe.xyz |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Namespace | \`${NAMESPACE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | \`${K3S_HOST}\` |" >> "$GITHUB_STEP_SUMMARY"
