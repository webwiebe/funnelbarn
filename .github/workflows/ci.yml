name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-quality:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # Host Go caches are ~25 GB and shared by every runner. cache: true tars
          # them and uploads on each key miss (20+ min in Post Set up Go); the host
          # keeps them warm, so the action does not cache.
          cache: false

      - name: go fmt
        run: |
          gofmt_output=$(gofmt -l .)
          if [ -n "$gofmt_output" ]; then
            echo "Files not formatted:"
            echo "$gofmt_output"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Regression harness (make regress)
        run: make regress

      - name: staticcheck (U1000 is the Go dead-code gate)
        # Pinned: a new staticcheck release would otherwise change what CI
        # enforces with no commit. Every check blocks at zero findings. The gate
        # also fails when U1000 analysed fewer packages than its floor, so a
        # toolchain staticcheck cannot load turns this step red.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          python3 scripts/staticcheck-gate.py

      - name: sqlc generate is up to date
        # sqlc reads every file in internal/repository/migrations as its schema,
        # so one unparseable migration silently breaks generation for the whole
        # repo. That went unnoticed from 00027 (July) until 00034 made it fail
        # loudly, by which point sqlcgen/models.go was missing three tables.
        # Regenerate and fail on any drift.
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          (cd internal/repository && sqlc generate)
          if ! git diff --exit-code -- internal/repository/sqlcgen; then
            echo "sqlcgen/ is out of date — run 'cd internal/repository && sqlc generate' and commit the result"
            exit 1
          fi

      - name: Go quality ratchets (complexity / file length / duplication)
        # Cyclomatic complexity, file length, and code duplication — each pinned
        # at today's worst value. They may only ratchet DOWN. See the script.
        run: bash scripts/go-quality-gates.sh

      - name: Gate script tests
        # The gate scripts are themselves tested, which nothing in this repo was
        # before: violation present fails, violation baselined passes, baseline
        # beatable fails, clean tree passes, and a tool that did not run fails
        # instead of reporting zero findings. test_deploy_graph.py additionally
        # asserts the shape of build-and-test.yml, so the CI dependency cannot be
        # removed again without turning this job red.
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet --disable-pip-version-check pyyaml
          .ci-venv/bin/python -m unittest discover -s scripts -p 'test_*.py' -v
          sh scripts/diff-coverage.test.sh

      - name: Install pinned lint tooling
        # Pinned, not @latest: a gate whose tool version can change without a
        # commit is a gate whose green run stops meaning anything.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Soak, golangci-lint
        # REPORT-ONLY against scripts/soak-baselines/golangci.txt. .golangci.yml
        # sat in this repo unread for months while README.md and the engineering
        # standards spec both listed `golangci-lint run ./...` as required; it
        # did not even load. 116 findings across 57 files are baselined and do
        # not block. A new finding, a worsened file, or a baseline that has
        # become beatable does block. Exit criterion in scripts/quality-soak.py.
        run: python3 scripts/quality-soak.py golangci

      - name: Soak, Go cyclomatic complexity at the estate target
        # REPORT-ONLY at complexity 12, while the blocking limit in
        # go-quality-gates.sh stays at 49. Makes the walk-down visible.
        run: python3 scripts/quality-soak.py go-complexity

      - name: Soak, file length at the estate target
        # REPORT-ONLY at 500 lines across internal/, cmd/, web/src/ AND sdks/.
        # sdks/ was covered by neither the Go scan nor the eslint scan, which is
        # where the repo's largest file (sdks/js/src/index.ts, 1076 lines) lives.
        run: python3 scripts/quality-soak.py file-length

  go-test:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6
        with:
          # Full history, so diff coverage can find the merge base with the PR's base branch.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # Host Go caches are ~25 GB and shared by every runner. cache: true tars
          # them and uploads on each key miss (20+ min in Post Set up Go); the host
          # keeps them warm, so the action does not cache.
          cache: false

      - name: Go tests with race detector
        # internal/api takes about 400s under -race on an idle runner and over
        # 600s when the mini is loaded, so go test's default 10m fails the gate.
        run: go test -race -count=1 -timeout=25m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage ratchet (per-file / per-package / global)
        # Fails if ANY first-party file is 0% covered, if any package drops below
        # its committed floor, or if global coverage drops. Floors are pinned at
        # current in scripts/coverage-baseline.txt (raise, never lower).
        run: python3 scripts/coverage-gate.py

      # Changed-line coverage, report only until 2026-10-31 (then add --enforce).
      # 40% of the coverable Go lines a PR adds must be executed by a test;
      # diffs under 10 coverable lines are exempt. Every nested module (sdks/go,
      # sdks/go-bugbarn) is profiled into a copy of coverage.out, so the ratchet
      # above keeps its numbers and a change in an SDK is measured too.
      # A measurement that cannot be made fails the job in report mode as well:
      # a missing or empty profile, an unknown base, a profile listing fewer than
      # 165 repository files, and 10 or more changed lines in files that add a
      # function but have no block in the profile.
      - name: Diff coverage (report only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          cp coverage.out "${RUNNER_TEMP}/diff.profile"
          for gomod in $(git ls-files -- '*/go.mod'); do
            dir=$(dirname "$gomod")
            (cd "$dir" && go test -count=1 -covermode=atomic -coverprofile="${RUNNER_TEMP}/module.profile" ./...)
            cat "${RUNNER_TEMP}/module.profile" >> "${RUNNER_TEMP}/diff.profile"
          done
          sh scripts/diff-coverage.sh "${RUNNER_TEMP}/diff.profile" "$PR_BASE"

      - name: Upload coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 1

  # sdks/go is its own module, so the root `go test ./...` never reached it and
  # the SDK shipped untested. Give it its own job.
  go-sdk:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # The SDK has no third-party dependencies, so there is no go.sum for
          # setup-go's cache to key on.
          cache: false

      - name: go fmt
        working-directory: sdks/go
        run: |
          gofmt_output=$(gofmt -l .)
          if [ -n "$gofmt_output" ]; then
            echo "Files not formatted:"
            echo "$gofmt_output"
            exit 1
          fi

      - name: go vet
        working-directory: sdks/go
        run: go vet ./...

      - name: Go SDK tests with race detector
        working-directory: sdks/go
        run: go test -race -count=1 ./...

  frontend-lint:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6
      - name: Set up pnpm
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/scripts/use-pnpm.sh"
          echo "$GITHUB_WORKSPACE/.tools/corepack-bin" >> "$GITHUB_PATH"
          if [ -d "$GITHUB_WORKSPACE/.tools/corepack/node_modules/.bin" ]; then echo "$GITHUB_WORKSPACE/.tools/corepack/node_modules/.bin" >> "$GITHUB_PATH"; fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        # tsc needs the SDK's dist types to typecheck web against it.
        run: pnpm --filter @funnelbarn/js build

      - name: TypeScript typecheck
        working-directory: web
        run: pnpm lint

      - name: ESLint
        working-directory: web
        run: pnpm lint:eslint

      - name: Dead code (knip ratchet)
        # Ratchet test blocks; it runs the real knip over throwaway packages.
        # The gate is enforced against a baseline of 0
        # (web/scripts/knip-ratchet.mjs); the file floor fails the step too.
        working-directory: web
        run: |
          pnpm lint:knip-test
          pnpm lint:knip

      - name: Soak, web cyclomatic complexity at the estate target
        # REPORT-ONLY at complexity 12 via web/eslint.soak.config.js, while the
        # blocking limit in web/eslint.config.js stays at 55.
        run: python3 scripts/quality-soak.py web-complexity

  frontend-test:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6
      - name: Set up pnpm
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/scripts/use-pnpm.sh"
          echo "$GITHUB_WORKSPACE/.tools/corepack-bin" >> "$GITHUB_PATH"
          if [ -d "$GITHUB_WORKSPACE/.tools/corepack/node_modules/.bin" ]; then echo "$GITHUB_WORKSPACE/.tools/corepack/node_modules/.bin" >> "$GITHUB_PATH"; fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # `pnpm test` builds first, so this covers the SDK's own suite as well as
      # producing the bundle the web app links against. It was previously only
      # built, never tested, in CI.
      - name: Build and test SDK
        run: pnpm --filter @funnelbarn/js test

      - name: Run Vitest with coverage ratchet
        # vitest enforces the per-metric coverage floors (all:true) from
        # vite.config.ts; pinned at current, raise-only.
        working-directory: web
        run: pnpm test:coverage

      - name: Per-file coverage ratchet (no new uncovered files)
        working-directory: web
        run: pnpm gate:coverage-perfile

      - name: Duplication ratchet (jscpd)
        working-directory: web
        run: pnpm gate:duplication

  secret-scan:
    runs-on: [self-hosted, build]
    timeout-minutes: 10
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/Applications/Docker.app/Contents/Resources/bin:/usr/bin:/bin:/usr/sbin:/sbin
      # Report-only until 2026-10-31: findings are annotated and the job passes.
      # Flip to `enforce` then. A scan that cannot run fails in both modes (exit 2).
      SECRET_SCAN_MODE: report
      SECRET_SCAN_MIN_COMMITS: '250'
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6
        with:
          # Full history: the scan reads every commit and the PR base.
          fetch-depth: 0
      - name: Gate self-test (planted secret)
        shell: bash
        run: bash scripts/tests/secret-scan.test.sh
      - name: Secret scan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/secret-scan.sh diff "origin/${{ github.base_ref }}"
          else
            bash scripts/secret-scan.sh history
          fi
