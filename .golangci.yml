# golangci-lint configuration.
#
# Invoked by `python3 scripts/quality-soak.py golangci`, which runs this config
# in REPORT-ONLY mode against a committed baseline
# (scripts/soak-baselines/golangci.txt). The soak does not yet break the build
# on a pre-existing finding; it fails on a new one, on a worsened file, and on
# a baseline that became beatable. The exit criterion is written at the top of
# scripts/quality-soak.py.
#
# Until 2026-09-08 this file existed and nothing ran it. It also did not load:
# it was written against the golangci-lint v1 schema while declaring
# `version: "2"`, so `golangci-lint config verify` rejected `linters.settings.goimports`
# and `issues.exclusions`, and `gosimple` no longer exists in v2 (folded into
# staticcheck). Both are fixed below.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wiebe-xyz/funnelbarn
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
