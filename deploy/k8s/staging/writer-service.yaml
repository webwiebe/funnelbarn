# The writer, reached only by the readers: they forward every request that
# writes the database here (spec 012, #302).
apiVersion: v1
kind: Service
metadata:
  name: funnelbarn-writer
spec:
  selector:
    app.kubernetes.io/name: funnelbarn
    app.kubernetes.io/environment: staging
  ports:
    - name: http
      port: 8080
      targetPort: http
