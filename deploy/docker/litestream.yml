dbs:
  - path: /var/lib/funnelbarn/funnelbarn.db
    replicas:
      - type: s3
        bucket: barn-backups
        path: ${LITESTREAM_REPLICA_PATH}
        endpoint: https://354b481466ca4280c50f2fb8cf9e3d45.eu.r2.cloudflarestorage.com
        region: auto
        force-path-style: true
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 24h
        sync-interval: 1s
